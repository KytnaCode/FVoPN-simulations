[project]
name = "fvopn-simulations"
version = "0.1.0"
description = "FVoPN simulations"
readme = "README.md"
authors = [{ name = "kytnacode", email = "kytnacode@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "hypothesis>=6.168.5",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pandas-stubs>=3.0.5.260914",
    "platformdirs>=4.13.4",
    "pytest>=9.1.1",
    "scipy>=1.18.1",
]

[project.scripts]
fvopn-simulations = "fvopn_simulations:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
