[project]
name = "fvopn-simulations"
version = "0.1.0"
description = "FVoPN simulations"
readme = "README.md"
authors = [{ name = "kytnacode", email = "kytnacode@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "hypothesis>=6.168.5",
    "numpy>=2.5.3",
]

[project.scripts]
fvopn-simulations = "fvopn_simulations:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
